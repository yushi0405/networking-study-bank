syllabus:
  categories:
    - security-app

questions:
  - id: tls-001
    question: "In TLS 1.3, is the server side of the channel always authenticated?"
    answer: "Yes"
    category: security-app
    tags:
      - tls
      - authentication
    source: "RFC 9846 — The Transport Layer Security (TLS) Protocol Version 1.3: https://www.rfc-editor.org/rfc/rfc9846.html"

  - id: tls-002
    question: "In TLS 1.3, is client authentication always required?"
    answer: "No"
    category: security-app
    tags:
      - tls
      - authentication
    source: "RFC 9846 — The Transport Layer Security (TLS) Protocol Version 1.3: https://www.rfc-editor.org/rfc/rfc9846.html"

  - id: tls-003
    question: "Which TLS security property keeps protected application data visible only to the endpoints?"
    answer: "Confidentiality"
    category: security-app
    tags:
      - tls
      - confidentiality
    source: "RFC 9846 — The Transport Layer Security (TLS) Protocol Version 1.3: https://www.rfc-editor.org/rfc/rfc9846.html"

  - id: tls-004
    question: "Which TLS security property allows modification of protected data to be detected?"
    answer: "Integrity"
    category: security-app
    tags:
      - tls
      - integrity
    source: "RFC 9846 — The Transport Layer Security (TLS) Protocol Version 1.3: https://www.rfc-editor.org/rfc/rfc9846.html"

  - id: tls-005
    question: "What does the TLS handshake establish for later traffic protection?"
    answer: "Shared keying material and negotiated cryptographic parameters"
    category: security-app
    tags:
      - tls
      - handshake
    source: "RFC 9846 — The Transport Layer Security (TLS) Protocol Version 1.3: https://www.rfc-editor.org/rfc/rfc9846.html"

  - id: quic-001
    question: "Which transport protocol does QUIC use underneath?"
    answer: "UDP"
    category: security-app
    tags:
      - quic
      - udp
    source: "RFC 9000 — QUIC: A UDP-Based Multiplexed and Secure Transport: https://www.rfc-editor.org/rfc/rfc9000.html"

  - id: http3-001
    question: "Which transport protocol carries HTTP/3?"
    answer: "QUIC"
    category: security-app
    tags:
      - http3
      - quic
    source: "RFC 9114 — HTTP/3: https://www.rfc-editor.org/rfc/rfc9114.html"

  - id: dhcp-001
    question: "What is the main purpose of DHCP?"
    answer: "To provide automated configuration parameters to hosts on an IP network"
    category: security-app
    tags:
      - dhcp
      - configuration
    source: "RFC 2131 — Dynamic Host Configuration Protocol: https://www.rfc-editor.org/rfc/rfc2131.html"

  - id: ssh-001
    question: "Which three security services are provided by the SSH transport layer protocol?"
    answer: "Server authentication, confidentiality, and integrity"
    category: security-app
    tags:
      - ssh
      - security
    source: "RFC 4253 — The Secure Shell (SSH) Transport Layer Protocol: https://www.rfc-editor.org/rfc/rfc4253.html"

  - id: ntp-001
    question: "What is the primary purpose of NTP?"
    answer: "To synchronize computer clocks over a network"
    category: security-app
    tags:
      - ntp
      - time
    source: "RFC 5905 — Network Time Protocol Version 4: https://www.rfc-editor.org/rfc/rfc5905.html"
